<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecobite — Food Rescue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --soil:#14110d; --moss:#173c22; --leaf:#8fc94d; --orange:#f58b08; --cream:#f7f3e9; --muted:#d1cabc; }
    * { box-sizing:border-box; margin:0; }
    html { scroll-snap-type:y mandatory; scroll-behavior:smooth; }
    body { background:var(--soil); color:var(--cream); font-family:Inter, sans-serif; }
    .panel { min-height:100vh; scroll-snap-align:start; scroll-snap-stop:always; }
    .home { position:relative; display:grid; place-items:center; overflow:hidden; padding:40px 20px; text-align:center; isolation:isolate; }
    .backdrop { position:absolute; z-index:-2; inset:-3%; background:url('kitchen-bg.jpg') center 62% / cover; animation:breathe 20s ease-in-out infinite alternate; }
    .home::after { content:""; position:absolute; inset:0; z-index:-1; background:radial-gradient(ellipse 65% 55% at 50% 48%, rgba(20,17,13,.20), rgba(20,17,13,.72)); }
    .brand { width:clamp(230px, 36vw, 440px); filter:drop-shadow(0 10px 20px rgba(0,0,0,.22)); animation:land 1s cubic-bezier(.25,.9,.35,1.1) both; }
    .tagline { margin-top:20px; color:var(--muted); font-size:clamp(.75rem, 1.4vw, .98rem); letter-spacing:.08em; }
    .tagline span { color:var(--orange); padding:0 .6em; }
    .scroll-cue { position:absolute; bottom:28px; font-size:.72rem; color:var(--muted); letter-spacing:.13em; text-transform:uppercase; animation:fade .7s .8s both; text-decoration:none; }
    .scroll-cue::after { content:'↓'; display:block; color:var(--orange); font-size:1.4rem; line-height:1.2; animation:bob 1.5s ease-in-out infinite; }
    .signin { position:relative; display:grid; place-items:center; overflow:hidden; padding:32px 20px; background:radial-gradient(circle at 12% 18%, rgba(143,201,77,.16), transparent 23%), radial-gradient(circle at 88% 78%, rgba(245,139,8,.14), transparent 24%), linear-gradient(135deg, #0f1b12, var(--soil)); }
    .food-float { position:absolute; z-index:0; font-size:clamp(2rem, 5vw, 4.2rem); filter:drop-shadow(0 12px 10px rgba(0,0,0,.2)); opacity:.88; pointer-events:none; animation:float 5s ease-in-out infinite; }
    .food-float.one { top:12%; left:11%; animation-delay:-1.6s; }
    .food-float.two { right:10%; top:22%; animation-delay:-3.2s; }
    .food-float.three { bottom:12%; left:15%; animation-delay:-.5s; }
    .food-float.four { right:14%; bottom:9%; animation-delay:-4s; }
    .card { position:relative; z-index:1; width:min(100%, 420px); padding:clamp(30px, 6vw, 52px); border:1px solid rgba(247,243,233,.15); border-radius:24px; background:rgba(20,17,13,.78); box-shadow:0 24px 70px rgba(0,0,0,.35); backdrop-filter:blur(10px); }
    .card img { display:block; width:140px; margin:0 auto 22px; }
    h1 { font:600 2rem Fraunces, serif; text-align:center; }
    .intro { margin:10px 0 28px; color:var(--muted); font-size:.9rem; line-height:1.55; text-align:center; }
    .food-note { display:flex; align-items:center; justify-content:center; gap:8px; margin:-10px 0 21px; color:#f6bd59; font-size:.76rem; letter-spacing:.03em; }
    label { display:block; margin:16px 0 7px; font-size:.75rem; font-weight:600; letter-spacing:.05em; }
    input { width:100%; padding:13px 14px; border:1px solid rgba(247,243,233,.22); border-radius:10px; background:rgba(247,243,233,.07); color:var(--cream); font:inherit; outline:none; }
    input:focus { border-color:var(--leaf); box-shadow:0 0 0 3px rgba(143,201,77,.12); }
    .password-wrap { position:relative; }
    .password-wrap input { padding-right:52px; }
    .password-treat { position:absolute; right:9px; top:50%; display:grid; place-items:center; width:34px; height:34px; border-radius:9px; background:rgba(245,139,8,.16); transform:translateY(-50%) rotate(-8deg); font-size:1.15rem; pointer-events:none; animation:wobble 2.4s ease-in-out infinite; }
    .password-hint { margin-top:8px; color:var(--muted); font-size:.72rem; }
    button { width:100%; margin-top:24px; padding:14px; border:0; border-radius:10px; color:#173c22; background:var(--leaf); cursor:pointer; font:600 .9rem Inter, sans-serif; transition:transform .2s ease, box-shadow .2s ease; }
    button:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(143,201,77,.2); }
    .back { display:block; margin-top:25px; color:var(--muted); font-size:.82rem; text-align:center; text-decoration:none; }
    @keyframes breathe { to { transform:scale(1.05); } }
    @keyframes land { from { opacity:0; transform:translateY(-35px) scale(.9); } to { opacity:1; transform:none; } }
    @keyframes fade { from { opacity:0; transform:translateY(10px); } to { opacity:1; } }
    @keyframes bob { 50% { transform:translateY(6px); } }
    @keyframes float { 50% { transform:translateY(-16px) rotate(10deg); } }
    @keyframes wobble { 50% { transform:translateY(-50%) rotate(8deg) scale(1.08); } }
    @media (prefers-reduced-motion:reduce) { *,*::after { animation:none!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <section class="panel home" id="home">
    <div class="backdrop"></div>
    <div>
      <img class="brand" src="ecobite-logo.png" alt="Ecobite">
      <p class="tagline">AI-POWERED FOOD RESCUE <span>•</span> FROM SURPLUS TO PLATE</p>
    </div>
    <a class="scroll-cue" href="#sign-in">Scroll to sign in</a>
  </section>
  <section class="panel signin" id="sign-in">
    <span class="food-float one" aria-hidden="true">🥑</span>
    <span class="food-float two" aria-hidden="true">🥕</span>
    <span class="food-float three" aria-hidden="true">🍞</span>
    <span class="food-float four" aria-hidden="true">🍅</span>
    <form class="card">
      <img src="ecobite-logo.png" alt="Ecobite">
      <h1>Welcome back</h1>
      <p class="intro">Sign in to rescue more food and make every meal matter.</p>
      <p class="food-note" aria-label="Good food, good mood"><span aria-hidden="true">🍋</span> Good food, good mood <span aria-hidden="true">🌿</span></p>
      <label for="email">EMAIL ADDRESS</label>
      <input id="email" type="email" placeholder="you@example.com" required>
      <label for="password">PASSWORD</label>
      <div class="password-wrap">
        <input id="password" type="password" placeholder="Your secret recipe" required>
        <span class="password-treat" aria-hidden="true" title="Your password is safely hidden">🍪</span>
      </div>
      <p class="password-hint">Your secret recipe stays safely hidden.</p>
      <button type="submit">Sign in &amp; dig in 🍽️</button>
      <a class="back" href="#home">↑ Scroll back to home</a>
    </form>
  </section>
</body>
</html>
